<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synqora — SyncSpace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #060911;
            background-image: 
                radial-gradient(at 10% 20%, rgba(0, 240, 255, 0.12) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(0, 255, 135, 0.08) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(124, 58, 237, 0.08) 0px, transparent 60%);
            color: #F8FAFC;
            min-height: 100vh;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        /* GLASSMORPHISM UTILITY */
        .glass-panel {
            background: rgba(19, 27, 46, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-panel-sub {
            background: rgba(9, 13, 22, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(36, 50, 77, 0.6); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 240, 255, 0.4); }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    
    <!-- Glass Topbar -->
    <header class="glass-panel border-b border-white/10 px-8 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <a href="dashboard.html" class="text-xl font-extrabold bg-gradient-to-r from-cyan-400 to-emerald-400 bg-clip-text text-transparent tracking-wide">SYNQORA // SYNCSPACE</a>
            <span class="bg-emerald-500/10 text-emerald-400 text-xs px-3 py-1 rounded-full border border-emerald-500/20 font-semibold font-mono">Live Workspace</span>
        </div>
        <div class="flex items-center space-x-5">
            <span id="userNameDisplay" class="text-sm font-semibold text-slate-200">Loading...</span>
            <a href="dashboard.html" class="glass-panel-sub hover:bg-white/10 text-slate-200 text-sm px-4 py-2 rounded-xl transition font-semibold border border-white/10">Dashboard</a>
        </div>
    </header>

    <!-- Main Chat Workspace -->
    <div class="flex flex-1 max-w-7xl mx-auto w-full p-6 gap-6 h-[calc(100vh-5rem)]">
        
        <!-- Left Sidebar: Connected Teammates -->
        <div class="w-80 glass-panel rounded-2xl p-4 flex flex-col">
            <h2 class="text-xs font-bold text-cyan-400 uppercase tracking-wider mb-4 font-mono">Accepted Roster</h2>
            <div id="teammatesList" class="space-y-2.5 overflow-y-auto flex-1 pr-1">
                <p class="text-xs text-slate-500 p-2 font-mono">Loading connections...</p>
            </div>
        </div>

        <!-- Right Side: Glass Chat Box -->
        <div class="flex-1 glass-panel rounded-2xl flex flex-col overflow-hidden shadow-2xl">
            <!-- Active Chat Header -->
            <div id="activeChatHeader" class="glass-panel-sub border-b border-white/10 p-4 px-6 text-sm font-bold text-slate-200 flex items-center justify-between">
                <span class="font-mono text-cyan-400 text-xs tracking-wide">SELECT A PEER TO INITIATE SYNCSPACE CHAT</span>
            </div>

            <!-- Messages Scroll Area -->
            <div id="chatMessagesBox" class="flex-1 p-6 overflow-y-auto space-y-4 flex flex-col justify-end text-sm">
                <div class="text-center text-slate-500 text-xs my-auto font-mono">No active session selected.</div>
            </div>

            <!-- Input Bar -->
            <div class="glass-panel-sub border-t border-white/10 p-4 px-6 flex gap-3">
                <input type="text" id="messageInput" onkeydown="if(event.key==='Enter') sendMessage()" placeholder="Type a message and press Enter..." class="flex-1 glass-panel-sub border border-white/10 px-4 py-3 rounded-xl text-sm text-white focus:outline-none focus:border-cyan-400 transition" disabled>
                <button onclick="sendMessage()" id="sendBtn" class="bg-gradient-to-r from-cyan-400 to-emerald-400 hover:opacity-90 text-slate-950 font-extrabold px-6 py-3 rounded-xl transition text-sm disabled:opacity-40 shadow-lg shadow-cyan-500/20" disabled>Send</button>
            </div>
        </div>

    </div>

    <!-- Script Logic -->
    <script>
        const API_BASE = 'http://localhost:5000';
        const token = localStorage.getItem('synqora_token');
        let currentUserId = null;
        let activeReceiverId = null;

        const storedUser = localStorage.getItem('synqora_user');
        if (storedUser) {
            try {
                const u = JSON.parse(storedUser);
                currentUserId = u.id;
                document.getElementById('userNameDisplay').innerText = u.full_name;
            } catch (e) { console.error(e); }
        }

        async function loadAcceptedTeammates() {
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/api/requests`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                if (data.success) {
                    const listEl = document.getElementById('teammatesList');
                    const accepted = data.requests.filter(r => r.status === 'accepted');

                    if (accepted.length === 0) {
                        listEl.innerHTML = `<p class="text-xs text-slate-500 p-3 font-mono">No accepted connections found.</p>`;
                        return;
                    }

                    listEl.innerHTML = accepted.map(r => `
                        <div onclick="selectChatUser(${r.peer_id}, '${String(r.peer_name).replace(/'/g, "\\'")}')" class="p-3.5 glass-panel-sub hover:bg-white/5 border border-white/10 rounded-xl cursor-pointer transition flex items-center justify-between group">
                            <div>
                                <p class="font-bold text-white text-sm group-hover:text-cyan-300 transition">${r.peer_name}</p>
                                <span class="text-xs text-cyan-400/80 font-mono">${r.project_title}</span>
                            </div>
                            <span class="text-emerald-400 text-[10px] font-bold font-mono">● LIVE</span>
                        </div>
                    `).join('');
                }
            } catch (err) {
                console.error('Failed to load contacts:', err);
            }
        }

        async function selectChatUser(userId, name) {
            activeReceiverId = userId;
            document.getElementById('activeChatHeader').innerHTML = `
                <span class="flex items-center gap-2.5">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_8px_#00FF87]"></span>
                    SyncSpace Channel: <strong class="text-white">${name}</strong>
                </span>
                <span class="text-xs font-mono text-cyan-400">ID: #${userId}</span>
            `;
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;
            fetchMessages();
        }

        async function fetchMessages() {
            if (!activeReceiverId) return;
            try {
                const res = await fetch(`${API_BASE}/api/chat/${activeReceiverId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                if (data.success) {
                    const box = document.getElementById('chatMessagesBox');
                    const messages = data.messages || [];

                    if (messages.length === 0) {
                        box.innerHTML = `<div class="text-center text-slate-500 text-xs my-auto font-mono">Workspace session active. Send the first message!</div>`;
                        return;
                    }

                    box.innerHTML = messages.map(m => {
                        const isMe = Number(m.sender_id) === Number(currentUserId);
                        return `
                            <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                                <div class="max-w-[70%] px-4 py-3 rounded-2xl text-sm ${isMe ? 'bg-gradient-to-r from-cyan-400 to-emerald-400 text-slate-950 font-semibold shadow-lg shadow-cyan-500/10' : 'glass-panel-sub text-slate-200 border border-white/10'}">
                                    ${m.message}
                                </div>
                                <span class="text-[10px] text-slate-500 mt-1 font-mono">${new Date(m.sent_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                            </div>
                        `;
                    }).join('');
                    box.scrollTop = box.scrollHeight;
                }
            } catch (err) {
                console.error('Failed to load messages:', err);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message || !activeReceiverId) return;

            try {
                const res = await fetch(`${API_BASE}/api/chat/send`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        receiver_id: activeReceiverId,
                        message: message
                    })
                });
                const data = await res.json();

                if (data.success) {
                    input.value = '';
                    fetchMessages();
                } else {
                    alert(data.message || 'Failed to send message.');
                }
            } catch (err) {
                console.error('Error sending message:', err);
            }
        }

        // Auto refresh messages every 3 seconds for live chat feel
        setInterval(() => {
            if (activeReceiverId) fetchMessages();
        }, 3000);

        window.onload = loadAcceptedTeammates;
    </script>
</body>
</html>
